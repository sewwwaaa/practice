name: security pipeline 

on:
  push: 
    branches: 
      - main
  pull_request:
    branches: 
      - main
  workflow_dispatch:
    
permission :
   contents: read


job:
  security_scan:
   runs-on: ubuntu-latest
   
   steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth:0

    - name: Setup Python
      uses: action/setup-python@v5
      with:
       python-version: '3.12'

    - name: SAST - Semgrep
      run: |
        python -m pip install Semgrep
        semgrep scan --config auto --error .

    - name: Setup Node.js
      uses: action/setup-node@v4
      with:
        node-version: '22'

    - name: SCA npm Audit
      run: |
        npm ci
        npm audit --audit-level=high

  secret-scan:
    run-on: ubuntu-latest

    steps:
      - name: secret Scanning - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GUTHUb_TOKEN}}
